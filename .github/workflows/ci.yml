name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: CLI smoke test
        run: |
          cargo run --locked -q -- sheet --kind creature --size 16 --count 8 --palette gb4 -o /tmp/s.png
          test -s /tmp/s.png && test -s /tmp/s.json
